[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-score-semantic-engine"
version = "0.1.0"
description = "Deterministic semantic reference and validation engine for ST score projects"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "partitura==1.9.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["st_score_semantic_engine"]
